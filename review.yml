  openapiHarvested: true
  specsCount: 4
  method: >-
    Azure API Management anonymous management-plane export. GET
    {managementApiUrl}/apis?api-version=2022-04-01-preview returned the API list; each API
    was then exported with ?export=true&format=openapi-link and the returned SAS blob URL
    downloaded verbatim. No spec was edited, reformatted or reconstructed.
  fetchDate: '2026-07-30'
  specs:
