  notHarvested:
  - api: GLS ShipIT REST API
    reason: >-
      GLS publishes no OpenAPI, Swagger or WADL for ShipIT. The reference is Doxygen HTML
      only. No spec was reconstructed - inventing one would fabricate a contract GLS has
      not published.
  - api: GLS Group developer portal API products
    reason: >-
      /portals/api/sites/gls-group-it-prod-developerportal/apidocs returns HTTP 401. The
      catalog is not enumerable without an account, so the API list is unknown rather than
      empty.
apiFamily:
  rating: not-published
  quoting: not-published
  labelCreation: >-
    Yes - POST /api/Label/Create (NL) and POST /backend/rs/shipments (ShipIT). Formats ZPL,
    PDF, PDF A6 unit/shipment, PDF 2xA4, PDF 4xA4, routing-data-only, and ZEBRA ZPL_200 /
    ZPL_300 plus PNG in ShipIT.
  labelVoid: Yes - POST /api/Label/Delete (NL), POST /backend/rs/shipments/cancel/{trackID} (ShipIT)
  manifest: Yes - POST /api/Label/Confirm and /api/Label/ConfirmMultiple (NL), POST /backend/rs/shipments/endofday (ShipIT)
  pickup: Yes - POST /api/Pickup/Create and /api/Pickup/Delete (NL), /backend/rs/sporadiccollection (ShipIT)
  tracking: Yes - polling plus registered webhooks (NL); polling only (ShipIT)
  proofOfDelivery: Yes - POST /api/pod/v1 (NL), POST /parcelpod (ShipIT), plus a signature-PNG webhook
  addressValidation: not-published
  customsDocumentation: >-
    Not exposed in any harvested spec. GLS documents customs handling in country-level
    portals and PDFs rather than in the published API contracts.
  returns: Yes - POST /api/ShopReturn/Create (NL), plus the ShopReturnService label variant
  serviceAvailability: Yes - POST /api/DeliveryOptions/GetDeliveryOptions (NL), POST /backend/rs/shipments/allowedservices and /backend/rs/timeframe/deliverydays (ShipIT)
  outOfHomeNetwork: Yes - POST /api/ParcelShop/GetParcelShops (NL), four ParcelShop search operations (ShipIT)
  sandboxWithoutCommercialAccount: false
