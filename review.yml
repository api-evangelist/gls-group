aid: gls-group
name: GLS Group
review:
  question: >-
    Does GLS Group publish a callable, standards-conformant API surface that the next
    party in a shipment chain can speak, or a proprietary contract bound to a GLS
    customer relationship?
  answer: proprietary-documented
  date: '2026-07-30'
  reviewer: API Evangelist
  tier: parcel-integrator
  cohort: air-cargo-parcel
  homeCountry: Netherlands
  primaryDomain: gls-group.com
  domainVerified: true
  domainNote: >-
    The roster hint gls-group.com resolves and returns HTTP 200 for GLS Group corporate
    content. gls-group.eu is a live sibling host serving the same CMS (also HTTP 200) and
    is what gls-group.com redirects deeper paths to. Both are genuinely GLS Group. No
    change to the hinted primary domain was needed.
findings:
  summary: >-
    GLS Group has three distinct, real, publicly reachable API surfaces and no single one
    of them. (1) A group-level Apigee developer portal at dev-portal.gls-group.net operated
    by GLS IT Services GmbH, where account creation is genuinely self-serve but the API
    catalog is only rendered after sign-in; "public" API products can be enabled by any
    registered app, "restricted" ones require an approval that takes 1-3 business days and
    a local GLS representative. (2) A GLS Netherlands Azure API Management portal at
    api-portal.gls.nl whose management plane answers anonymously, from which four OpenAPI
    3.0.1 documents were exported verbatim (Label API prod + test, Track & Trace prod +
    test). (3) The group-wide GLS ShipIT web services, documented publicly and in detail as
    Doxygen pages at shipit.gls-group.eu, but with no published base URL — GLS explicitly
    states the endpoint is given to you with your credentials by your primary GLS contact.
    Not one artifact in any of the three references an industry data standard.
  developerPortals:
  - url: https://dev-portal.gls-group.net/
    httpStatus: 200
    platform: Google Apigee integrated developer portal
    operator: GLS IT Services GmbH
    selfServeRegistration: true
    catalogPubliclyVisible: false
    note: >-
      Portal shell renders anonymously; siteId gls-group-it-prod-developerportal. The
      /portals/api/sites/{siteId}/liveportal/page/{id} endpoint answers anonymously for
      index, get-started and faq pages, but /portals/api/sites/{siteId}/apidocs returns
      HTTP 401 "No authorization header provided". The list of API products is therefore
      not publicly enumerable.
  - url: https://api-portal.gls.nl/
    httpStatus: 200
    platform: Azure API Management developer portal (apim-glsnl-api-prod)
    selfServeRegistration: true
    catalogPubliclyVisible: true
    note: >-
      /config.json (HTTP 200) discloses managementApiUrl
      https://apim-glsnl-api-prod.management.azure-api.net/... at api-version
      2022-04-01-preview, which answers anonymously. GET /apis returned 5 entries
      (2 revisions of the Label API production, Label API test, T&T production,
      T&T test). Each exported via ?export=true&format=openapi-link to a SAS-signed
      blob, all HTTP 200.
  - url: https://shipit.gls-group.eu/webservices/3_4_19/doxygen/WS-REST-API/index.html
    httpStatus: 200
    platform: Doxygen-generated reference (generated 2024-01-09, Doxygen 1.9.7)
    selfServeRegistration: false
    catalogPubliclyVisible: true
    note: >-
      Mirrored identically at shipit.gls-group.com (HTTP 200). Full method, field and
      validation documentation is public; the base URL is not.
