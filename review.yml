interoperability:
  standardConformance:
    standard: none
    verdict: no standard reference found
    version: null
    evidence:
    - url: https://api-portal.gls.nl/content/GLS_Shipping_API_v0.8.pdf
      httpStatus: 200
      note: >-
        19-page "GLS Shipping API v0.8" integration guide. Describes GLS-proprietary
        endpoints, GLS product/service codes and GLS UnitType codes (BP, CO, LG, MP, PL,
        RL, XL). No reference to GS1, EPCIS, SSCC, GTIN, UN/EDIFACT, ANSI X12, UPU,
        UN/CEFACT, WCO Data Model, eFTI or any other external data standard.
    - url: https://shipit.gls-group.eu/webservices/3_4_19/doxygen/WS-REST-API/index.html
      httpStatus: 200
      note: >-
        ShipIT 3.4.19 REST reference. Media types are the vendor-specific
        application/glsVersion1+json. Types are Java package names under
        eu.glsgroup.fpcs.datatypes.soap.v1.*. No standards body is cited anywhere.
    - artifact: openapi/gls-netherlands-label-api-openapi.yml
      note: >-
        Grepped the four harvested OpenAPI documents for gs1, sscc, gtin, edifact, x12,
        iso 6346, un/locode, upu, epcis, dcsa. Zero genuine hits (the only "ssCC" matches
        were substrings of the field name emailAddressCC).
    caveats: >-
      GLS is a private ground carrier, not a UPU designated postal operator, so UPU
      standards posture is not applicable to it. Country and currency fields use ISO codes
      and labels are produced in Zebra ZPL, but neither is a logistics interchange standard.
      A ChangeOfDelivery/partner block in the Track & Trace webhook payload carries an
      "ndis" array with a Type such as SPICHPCLNUM and a partner parcel number, which is a
      bilateral partner-carrier identifier exchange, not a standards-based one.
  interfaceShape: proprietary-documented
  interfaceShapeEvidence: >-
    Every published contract is unique to GLS. The Netherlands Label API is a set of
    RPC-style POST verbs (/api/Label/Create, /api/Label/Confirm, /api/Pickup/Create) with
    107 GLS-specific schemas; the Track & Trace API is three POST reads
    (/api/parcel/v1/details, /api/parcel/v1/search, /api/pod/v1); ShipIT is a fourth,
    differently-shaped contract with its own vendor media type. Nothing another carrier
    also implements. A shipper integrating GLS and a second carrier writes two integrations,
    which is exactly why Shippo, EasyPost and Sendcloud exist in this cohort.
  identifierScheme: >-
    Entirely GLS-proprietary. ShipIT keys on TrackID (alphanumeric, max 40), ParcelNumber
    (11 or 12 digits), ShipmentReference and ShipmentUnitReference (max 40),
    PartnerParcelNumber (max 50) and ContactID (the 10-char shipper identifier). The
    Netherlands stack adds parcelNo, uniqueNo, shipmentParcelNo, shipmentUniqueNo, gpNo
    (the international parcel number for import/export), custNo (GLS customer number) and
    customerReference. ParcelShops are addressed as {partnerID}-{localID}, e.g.
    GLS_DE-2761234567. Depots are identified by GLS depot codes. The only shared,
    cross-party identifiers anywhere in the surface are ISO country codes and postal codes.
    No GS1 GTIN/SSCC/GLN, no SCAC, no EORI or HS codes, no UN/LOCODE, no DUNS.
  eventModel: webhook-and-polling
  eventModelEvidence: >-
    Polling: POST https://api.gls.nl/tt/V1/api/parcel/v1/details and
    POST /api/parcel/v1/search return an events[] array per parcel with eventId, eventNo,
    reasonNo, descriptionNL, descriptionEN, country, countryName, depot, depotName, date
    and isPhysical, plus state/substate and an eta block. POST /api/pod/v1 returns proof of
    delivery. ShipIT offers the same read pattern (POST /parcels, /parceldetails,
    /parcelpod) and documents no push at all.
    Push: GLS Netherlands operates two customer-registered webhooks documented at
    https://api-portal.gls.nl/track-trace-webhook (HTTP 200) and
    https://api-portal.gls.nl/content/webhooks.pdf (HTTP 200) - one for parcel events, one
    delivering the recipient signature as a PNG proof of delivery. The receiver must return
    HTTP 200; failures are retried with increasing intervals and the webhook is eventually
    suspended until the customer contacts GLS to reactivate it.
    Critically, there is NO subscription or webhook-registration operation in any published
    OpenAPI document. Registration is an out-of-band request to GLS in which the customer
    supplies the callback URL. The event vocabulary (eventNo, reasonNo) is a GLS-internal
    numeric code list, not DCSA event types or GS1 EPCIS events, and the code list itself is
    not published.
  ediLegacy: >-
    No EDI referenced. Nothing in the GLS Group developer portal, the GLS Netherlands
    portal, the Shipping API guide or the ShipIT 3.4.19 reference mentions UN/EDIFACT
    (IFTMIN/IFTSTA/DESADV), ANSI X12 (204/214/856), AS2, OFTP2 or a VAN. The legacy layer
    here is not EDI but SOAP - ShipIT's REST resources are documented over the same
    eu.glsgroup.fpcs.datatypes.soap.v1.* type model as its SOAP web services, so REST is a
    later veneer over a SOAP-era contract. Onboarding is a mapping project against GLS's own
    JSON, not an EDI mapping project.
  multiPartyPosture: >-
    Publishes only to its own contracted shippers and to the aggregators that resell it.
    A shipper cannot self-serve into a callable GLS surface: the Netherlands APIs require
    MyGLS username and password that "are provided to the shipper", and ShipIT's endpoints
    are stated to be "obtained from your primary GLS contact and will be given with your
    credentials". The group Apigee portal lets anyone register an account and an app, but
    gates restricted API products behind approval by a local GLS representative. GLS
    publishes no partner/marketplace directory of pre-built integrations of its own; its
    de-facto integration directory lives on the aggregator side (Sendcloud, EasyPost,
    Shippo and the e-commerce platforms all list GLS as a supported carrier). GLS does
    consume from counterparties bilaterally - the webhook payload carries partner-carrier
    parcel numbers such as SPICHPCLNUM for handovers - but that exchange is not published.
    The surface is also federated by country rather than by group: api-portal.gls.nl is a
    GLS Netherlands Azure tenant, entirely separate from the group Apigee portal, and other
    national units run their own.
  accessGate: customer-account-required
  accessGateDetail: >-
    Two gates stacked. Registration: creating a developer account on
    dev-portal.gls-group.net is self-serve (full name, email, password, company, country, zip, email
    verification, reCAPTCHA), and creating an app that enables a public API product needs
    nothing further; a restricted product needs a Request that a GLS team approves in 1-3
    business days. Calling: a live GLS customer relationship is mandatory regardless. The
    GLS Shipping API guide states plainly that "a MyGLS username and password must be
    included in the API request" and that "the MyGLS credentials are provided to the
    shipper" - i.e. you must already be a contracted GLS shipper with an operational
    customer number. ShipIT goes further and withholds the endpoint URL itself until a GLS
    contact issues credentials. A sandbox exists but only inside the same gate: GLS
    Netherlands publishes a test environment at https://api.gls.nl/test/v1 (labels) and
    https://api.gls.nl/tt-test (tracking) whose OpenAPI is public, yet the test credentials
    are still MyGLS credentials. There is no anonymous try-it path to a working call.
  dcsaMembershipVsPublication: not-applicable
  dcsaNote: >-
    DCSA is the container-shipping standards body; GLS is a road-based parcel and LTL
    freight carrier and is not a DCSA member and publishes nothing DCSA-shaped. Recorded
    here only to close out the sector template question.
