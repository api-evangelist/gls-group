              example:
                parcels:
                - id: string
                  custNo: string
                  parcelNo: string
                  uniqueNo: string
                  shipmentParcelNo: string
                  shipmentUniqueNo: string
                  gpNo: string
                  jobDate: string
                  initialDate: string
                  events:
