                    email: string
                    city: string
                    street: string
                    zipCode: string
                    country: string
                    houseNumber: string
                    houseNumberAddition: string
                    name1: string
                    name2: string
                    name3: string
                  length: 0
                  height: 0
                  width: 0
                  suppliedWeight: 0
                  weightedWeight: 0
                  product: string
                  customerReference: string
                  state: string
                  subState: string
                  eta:
