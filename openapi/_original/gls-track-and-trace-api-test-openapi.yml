openapi: 3.0.1
info:
  title: GLS T&T Api - Test
  description: GLS Track & Trace API Test environment
  version: '1.0'
servers:
  - url: http://api.gls.nl/tt-test
  - url: https://api.gls.nl/tt-test
paths:
