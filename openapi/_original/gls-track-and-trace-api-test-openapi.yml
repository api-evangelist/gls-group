              example:
                parcels:
                  - id: string
                    custNo: string
                    parcelNo: string
                    uniqueNo: string
                    shipmentParcelNo: string
                    shipmentUniqueNo: string
                    gpNo: string
                    jobDate: string
                    initialDate: string
                    events:
                      - eventId: string
                        eventNo: 0
                        reasonNo: 0
                        descriptionNL: string
                        descriptionEN: string
                        country: string
                        countryName: string
                        depot: string
                        depotName: string
                        details: string
                        date: string
                        isPhysical: true
                    addresses:
                      - addressType: string
                        email: string
                        city: string
                        street: string
                        zipCode: string
                        country: string
                        houseNumber: string
                        houseNumberAddition: string
                        name1: string
                        name2: string
                        name3: string
                    length: 0
                    height: 0
                    width: 0
                    suppliedWeight: 0
                    weightedWeight: 0
                    product: string
                    customerReference: string
                    state: string
                    subState: string
                    eta:
                      startTime: string
                      endTime: string
                      stops: 0
                      latitude: 0
                      longitude: 0
                    finalLocCode: string
                    deliveryCountry: string
                    deliveryZipcode: string
                    deliveryName: string
                    stopId: string
                    stopIdDateTime: 0
                    uri: string
                    carrierIntegrator: string
                    ndis:
                      - type: string
                        number: string
                    lastModified: 0
            text/json:
              schema:
                $ref: '#/components/schemas/ParcelDetailsResponseDto'
              example:
                parcels:
                  - id: string
                    custNo: string
                    parcelNo: string
                    uniqueNo: string
                    shipmentParcelNo: string
                    shipmentUniqueNo: string
                    gpNo: string
                    jobDate: string
                    initialDate: string
                    events:
                      - eventId: string
                        eventNo: 0
                        reasonNo: 0
                        descriptionNL: string
                        descriptionEN: string
                        country: string
                        countryName: string
                        depot: string
                        depotName: string
                        details: string
                        date: string
                        isPhysical: true
                    addresses:
                      - addressType: string
                        email: string
                        city: string
                        street: string
                        zipCode: string
                        country: string
                        houseNumber: string
                        houseNumberAddition: string
                        name1: string
                        name2: string
                        name3: string
                    length: 0
                    height: 0
                    width: 0
                    suppliedWeight: 0
                    weightedWeight: 0
                    product: string
                    customerReference: string
                    state: string
                    subState: string
                    eta:
                      startTime: string
                      endTime: string
                      stops: 0
                      latitude: 0
                      longitude: 0
                    finalLocCode: string
                    deliveryCountry: string
                    deliveryZipcode: string
                    deliveryName: string
                    stopId: string
                    stopIdDateTime: 0
                    uri: string
                    carrierIntegrator: string
                    ndis:
                      - type: string
                        number: string
                    lastModified: 0
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                default:
                  value: 
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
  /api/parcel/v1/search:
