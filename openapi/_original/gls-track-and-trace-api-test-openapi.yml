        - Parcel
      summary: /api/parcel/v1/details - POST
      operationId: post-api-parcel-v1-details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetParcelsDetailsRequestDto'
            example:
              userName: string
              password: string
              parcelNumbers:
                - string
