openapi: 3.2.0
info:
  title: GLS Netherlands LabelApi - Production Monitor API
  description: GLS Label API Production environment
  version: v1
servers:
- url: https://api.gls.nl/v1
tags:
- name: Monitor
paths:
  /api/Monitor/HealthProbe:
    head:
      tags:
      - Monitor
      summary: HealthProbe
      operationId: HealthProbe
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: null
            application/json:
              schema:
                type: string
              example: string
            text/json:
              schema:
                type: string
              example: string
