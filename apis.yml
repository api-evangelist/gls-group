- aid: gls-group:gls-netherlands-track-and-trace-api
  name: GLS Netherlands Track and Trace API
  description: >-
    Read API for parcel status and proof of delivery in the GLS Netherlands network. Three
    documented operations — POST /api/parcel/v1/details, POST /api/parcel/v1/search and
    POST /api/pod/v1 — return parcel event history, address data, dimensions, weight, product,
    state/substate, ETA and a tracking URI, plus proof-of-delivery documents. Complemented by
    two customer-registered push webhooks (parcel events and signature/proof-of-delivery PNG)
    that GLS POSTs to a URL the customer supplies out of band; there is no self-service
    subscription endpoint. An OpenAPI 3.0.1 definition is anonymously exportable, and a test
    environment is published at https://api.gls.nl/tt-test.
  humanURL: https://api-portal.gls.nl/api-details#api=track-trace-api-v1
  baseURL: https://api.gls.nl/tt/V1
