aid: gls-group
url: https://raw.githubusercontent.com/api-evangelist/gls-group/refs/heads/main/apis.yml
name: GLS Group
kind: company
description: >-
  GLS Group (General Logistics Systems B.V.) is a European ground-based parcel and freight
  carrier headquartered in Amsterdam-Duivendrecht, Netherlands, and owned by International
  Distributions Services plc. It operates a road network of more than 120 hubs and roughly
  1,600 depots across some 50 countries in Europe, the United States and Canada, moving B2B
  and B2C parcels up to about 32 kg plus a freight/LTL and express line, with an out-of-home
  ParcelShop and locker network. In the supply chain it is a last-mile and middle-mile parcel
  integrator: the party a shipper, e-commerce platform or shipping-API aggregator hands a
  consignment to for pickup, linehaul, customs clearance and delivery. Its API posture is
  federated and contract-bound rather than unified. The GLS Group developer portal
  (dev-portal.gls-group.net, run by GLS IT Services GmbH on Apigee) allows self-serve account
  and app registration with API keys or OAuth 2.0, but its API catalog is only visible after
  sign-in and "restricted" APIs additionally require approval by a local GLS representative.
  National units run their own portals — GLS Netherlands publishes an Azure API Management
  portal at api-portal.gls.nl whose OpenAPI 3.0.1 definitions for the Label API and the Track
  & Trace API are anonymously readable, but calling them still requires MyGLS credentials
  issued to a contracted shipper. The group-wide GLS ShipIT REST/SOAP web services are fully
  documented in public Doxygen reference pages, yet the base URL itself is handed out only
  with credentials by a customer's primary GLS contact. No industry data standard —
  GS1/EPCIS, UPU, DCSA, IATA ONE Record, UN/EDIFACT or ANSI X12 — is referenced anywhere in
  the artifacts GLS publishes; every identifier and event vocabulary is GLS-proprietary.
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
tags:
- Logistics
- Supply Chain
- Netherlands
- Parcel
- Shipping
- Track and Trace
- Freight
- Last Mile
- Europe
- Customs
