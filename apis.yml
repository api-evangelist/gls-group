apis:
- aid: gls-group:gls-netherlands-label-api
  name: GLS Netherlands Label API
  description: >-
    RESTful shipping API for printing labels and manifesting shipping data for GLS Netherlands.
    Covers login validation, label creation (parcel ShipType "P" and freight ShipType "F"),
    label deletion, single and multiple label confirmation, ParcelShop lookup, delivery-option
    lookup, pickup creation and deletion, and shop-return creation. Labels are returned as ZPL
    or Base64 PDF (pdf, pdfa6u, pdfa6s, pdfroutingonly, pdf2a4, pdf4a4), or the raw routing
    data can be returned so the customer prints their own label. Authentication carries MyGLS
    username and password in the request body; the developer-portal subscription key is issued
    per registered product. An OpenAPI 3.0.1 definition is anonymously exportable from the
    Azure API Management portal, and a separate test environment is published at
    https://api.gls.nl/test/v1.
  humanURL: https://api-portal.gls.nl/api-details#api=gls-netherlands-labelapi-production
  baseURL: https://api.gls.nl/v1
